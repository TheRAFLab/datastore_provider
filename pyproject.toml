[project]
name = "datastore-provider"
version = "0.1.1"
description = "A Python/Polars provider for reading folders of data files (JSONL, CSV, Parquet) as tables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "The RAF Lab" },
]
keywords = ["polars", "datastore", "parquet", "jsonl", "csv", "dataframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "polars>=1.43.2",
]

[project.urls]
Homepage = "https://github.com/TheRAFLab/datastore_provider"
Repository = "https://github.com/TheRAFLab/datastore_provider"
Issues = "https://github.com/TheRAFLab/datastore_provider/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datastore_provider"]
