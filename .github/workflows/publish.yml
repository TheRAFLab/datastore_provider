name: Publish

# A published GitHub Release goes to PyPI. Running the workflow by hand is a
# dry run: it always targets TestPyPI, so a manual trigger can never publish a
# real release by mistake.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        if: github.event_name == 'release'
        run: |
          project_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match the version in pyproject.toml ('${project_version}')." >&2
            echo "Bump the version, or retag the release, before publishing." >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/datastore-provider

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a rehearsal target, so re-running a dry run for a
          # version already uploaded should not fail the workflow.
          skip-existing: true

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored. The environment must exist on the repository and be
    # named in the PyPI publisher configuration.
    environment:
      name: pypi
      url: https://pypi.org/p/datastore-provider

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
